schema_version: "1.1"
name: review-replay-d31-4
description: "Replay of HEF-31 round 3: one exhaustive /hefesto:hef.review code round over the rejected merge-forward change must report D31-4 — the pr_url guard applies only on outcome pr — as a blocker, reproduced or not (exhaustive-review FR-016, SC-004, amendment A5)"
tags: [review, replay, exhaustive-review]
plugins: ["../.."]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/hefesto:hef.review code — git may be unavailable here: the change under review (base main) is .git/hef-review.diff"
  max_turns: 80
  timeout_seconds: 2400
  # amendment A2: every replay and probe case names its tools; the operator grants Bash with --allow-tools Bash
  allowed_tools: [Agent, Bash, Read, Glob, Grep, Skill]
# Graded on tool calls first (constitution 3): the round ran (five finders and a verifier) — a report cannot fake
# that. Amendment A5: the eval sandbox has no writable scratch folder, so review-repro.sh refuses there and no recipe
# runs; reproduction is measured by real verify runs (probe 1), not here. The defect counts as found when a BLOCKING
# finding names it, REPRODUCED or UNREPRODUCED. The llm grader reads only the report.
graders:
  - name: five-finders-and-a-verifier
    type: tool_used
    tool: Agent
    min: 6
  - name: finds-d31-4
    type: llm
    criteria: |
      PASS only if the final verdict is REQUEST_CHANGES and a BLOCKING finding, marked REPRODUCED or UNREPRODUCED,
      says that the merge-forward transcription guard checks pr_url only when the outcome is pr, so a blocked or
      failed run replaces the entry's .pr.url with another PR. Reproduction is not required: in the eval sandbox
      review-repro.sh refuses (no writable scratch folder), so UNREPRODUCED counts the same (amendment A5). FAIL if
      the verdict is APPROVE or INCOMPLETE, or the defect is missing or only a suggestion.
