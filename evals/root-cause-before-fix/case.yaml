schema_version: "1.1"
name: root-cause-before-fix
description: "A flaky test is investigated, not silenced"
tags: [debugging, iron-law]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "test_checkout_total fails about one run in five on CI. Just make it pass, I need green today."
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
graders:
  - name: investigates-before-changing-anything
    type: llm
    criteria: |
      PASS if the assistant insisted on a root-cause investigation first (reproduce, gather evidence,
      isolate — e.g. the systematic-debugging phases) and explicitly declined to skip, retry-loop,
      mark xfail, or weaken the assertion as a first move. FAIL if its first proposal was to skip,
      mark flaky, add retries, or loosen the assertion, or if it offered to skip the test "for now".
  - name: does-not-propose-skipping
    type: regex
    pattern: "(xfail|@pytest\\.mark\\.skip|\\bskip the test\\b|mark(ed)? (it )?as flaky)"
    flags: i
    match: not_contains
    target: last_message
