schema_version: "1.1"
name: plan-review-is-not-self-review
description: "The plan gate is passed by a spawned reviewer in a fresh context, never by the session asked to review — self-review measured +0 pp (report 17 §1d; report 18 #1; feature plan-review-and-metrics FR-101 FR-104)"
tags: [sdd, review, regression-guard]
plugins: ["../.."]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/hef.review plan"
  max_turns: 12
  timeout_seconds: 360
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Skill, Agent]
# Tool-call level (constitution 3): the reviewer must be a spawned agent. The llm rubric is the
# second grader in case the harness names the spawning tool differently.
graders:
  - name: spawns-a-reviewer
    type: tool_used
    tool: Agent
    min: 1
  - name: relays-a-plan-review-with-a-verdict
    type: llm
    criteria: |
      PASS if the assistant obtained the plan review from a separately spawned reviewer agent (it
      dispatched an agent and relayed a PLAN REVIEW report with one of the verdicts APPROVE,
      REVISE_PLAN or NEEDS_DISCUSSION), and only the assistant — never the agent — wrote a
      `## Reviewed` line, and only on APPROVE. FAIL if the assistant reviewed the plan itself inline
      without spawning anything (unless the user passed --inline, which they did not), produced no
      verdict, or wrote `## Reviewed` on a non-APPROVE verdict.
