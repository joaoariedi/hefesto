name: macos-probe
on:
  push:
    branches: [feature/macos-support]
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace the marker summary
        run: |
          T=$(mktemp -d); cd $T; git init -q .; mkdir -p tasks .claude
          printf '# TODO\n\n## 📥 NXT-S7-FB-06 — Net profit columns\ntext\n\n## 🔧 PCAL-CONSOL — consolidated spec\ntext\n\n## 📥 HC-FB-02 — haircut feedback\n' > tasks/TODO.md
          printf '# DOING\n' > tasks/DOING.md; printf '# Backlog\n' > tasks/BACKLOG.md; printf '# Done\n' > tasks/DONE.md
          printf '{"source":"tasks-repo","root":"tasks","states":{"📥":"intake","🧪":"on staging"}}\n' > .claude/project-status.json
          echo "LANG=${LANG:-unset} LC_ALL=${LC_ALL:-unset} LC_CTYPE=${LC_CTYPE:-unset}"; locale
          /bin/bash $GITHUB_WORKSPACE/hooks/status-board.sh 2>&1 | grep -E "todo|intake"
          echo "--- column_items under trace"
          /bin/bash -c 'source <(sed -n "/^starts_like_text()/,/^}/p; /^column_items()/,/^}/p" '"$GITHUB_WORKSPACE"'/hooks/status-board.sh); ITEM_HEADING="^#{2,3} "; ID_PATTERN="[A-Z][A-Z0-9]+(-[A-Z0-9]+){1,4}"; column_items tasks/TODO.md | od -c | head -20'
          echo "--- first token bytes"; grep -E "^## " tasks/TODO.md | sed -E "s/^#+ *//" | while IFS= read -r l; do f="${l%% *}"; printf "%s" "$f" | od -An -tx1; done
          echo "--- jq states lookup"; jq -r --arg m "📥" '.states[$m] // $m' .claude/project-status.json
          echo "--- uniq -c"; printf '\t📥\n\t🔧\n\t📥\n' | cut -f2 | sed '/^$/d' | sort | uniq -c | sort -rn | od -c | head
