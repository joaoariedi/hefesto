name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly. The live tier rots precisely because nothing runs it: it stayed 13-red for
    # months behind SMOKE_LIVE=1 while every PR reported green (#56).
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # helper subcommands read git history

      # Tier 1 only on the PR path. The live tier does NOT need an authenticated CLI - its
      # end-to-end check probes `claude -p` and self-skips on "not logged in" (smoke.sh:767).
      # What it needs is the `claude` BINARY, and installing it is exactly the install STEP
      # the zero-install rule below forbids. So it runs in the separate opt-in job instead,
      # not never (#56).
      - name: Smoke test (structural + regression)
        run: tests/smoke.sh

      # No `actions/setup-node`: ubuntu-latest ships node, and `node --test` is built into node >=18.
      # No package.json, no npm install, no lockfile — that is what keeps this inside the project's
      # zero-install rule, which forbids the install STEP rather than the runtime.
      #
      # `node --test`, NOT `node --test tests/`: passing the directory makes node try to load it as a
      # module and fail with "Cannot find module .../tests". Bare `node --test` discovers *.test.js
      # from the repo root. This was written the other way in the plan and only surfaced on the first
      # real run.
      #
      # Caveat, accepted deliberately: skipping setup-node leaves the node version unpinned, so a
      # runner image change can shift it silently. Pinning would require the install step the rule
      # exists to avoid.
      - name: Workflow behaviour tests
        run: node --test

  # macOS: the hooks run under #!/bin/bash, which is 3.2 there, with BSD sed/date/stat/mktemp. A
  # hook that leaned on bash 4 (declare -A, an empty array under set -u) or a GNU flag broke /hef.status,
  # /hef.babysit and the session-start hook for every Mac user while every Linux run stayed green.
  # This job runs the same suite on the stock macOS userland so that cannot happen silently again.
  # No Homebrew bash or coreutils is installed: the Mac a user has is the one tested.
  smoke-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Smoke test on macOS (/bin/bash 3.2, BSD tools)
        run: /bin/bash tests/smoke.sh

  # Not on the PR path: this job installs the claude CLI, which the zero-install rule keeps out
  # of the job above. It carries no credentials, so the end-to-end check self-skips; everything
  # else in the tier - the throwaway-config install, `plugin list`, and every command invocation
  # substituted and executed - runs for real. That is the part that had no CI protection and is
  # what regressed unnoticed.
  live:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Smoke test (structural + live)
        env:
          SMOKE_LIVE: '1'
        run: tests/smoke.sh
